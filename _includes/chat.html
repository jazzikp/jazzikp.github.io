<div class="chat-dock">
    <button class="chat-hint" type="button" data-open-chat>Ask Jazzik</button>
    <button class="chat-launcher" type="button" data-open-chat aria-label="Ask Jazzik">
        <img src="{{ site.baseurl }}/img/avatar-anime.jpg" alt="">
    </button>
</div>
<div class="chat-panel" id="grok-chat">
    <div class="chat-head">
        <img src="{{ site.baseurl }}/img/avatar-anime.jpg" alt="">
        <div>
            <strong>Jazzik</strong>
        </div>
        <button class="chat-close" type="button" data-close-chat aria-label="Close">×</button>
    </div>
    <div class="chat-log" id="grok-log"></div>
    <div class="chat-status" id="grok-status"></div>
    <form class="chat-form" id="grok-form">
        <textarea id="grok-input" rows="1" placeholder="Ask Jazzik anything…" required></textarea>
        <button type="submit">Send</button>
    </form>
</div>
