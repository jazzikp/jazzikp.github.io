---
title: Projects
layout: page
permalink: /projects/
description: Things I built. Research notes live in Blogs.
---
<div class="projects-page">
    <div class="project-grid">
        {% for p in site.data.projects %}
        <a class="project-card" href="{{ p.url }}" {% if p.url contains 'http' %}target="_blank" rel="noopener"{% endif %}>
            <div class="project-meta">
                <time>{{ p.year }}</time>
                <span class="project-kind">{{ p.kind }}</span>
            </div>
            <h3>{{ p.title }}</h3>
            <p>{{ p.summary }}</p>
        </a>
        {% endfor %}
    </div>
</div>
