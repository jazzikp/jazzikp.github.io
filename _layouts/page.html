---
layout: default
---
<header class="page-hero">
    <div class="wrap">
        {%- assign eyebrow = page.eyebrow | default: site.author -%}
        <p class="eyebrow" {% if page.eyebrow_zh %}data-i18n-zh="{{ page.eyebrow_zh | escape }}"{% endif %}>{{ eyebrow }}</p>
        <h1 {% if page.title_zh %}data-i18n-zh="{{ page.title_zh | escape }}"{% endif %}>{{ page.title }}</h1>
        {% if page.description %}<p {% if page.description_zh %}data-i18n-zh="{{ page.description_zh | escape }}"{% endif %}>{{ page.description }}</p>{% endif %}
    </div>
</header>
<div class="wrap">
    {{ content }}
</div>
