# Interface strings, in both languages.
#
# Long-form prose is not here — post bodies carry their own EN/ZH panels and
# page headings use `title_zh` / `description_zh` in their front matter. This
# file is only the chrome that surrounds them: navigation, footer, and the
# handful of labels that appear on every page.
#
# `zh` values are generated by `npm run translate` and then reviewed. An empty
# `zh` is not fatal — the template falls back to the English string — so a new
# key can land before its translation does.

