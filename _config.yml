# ---------------------------------------------------------------------------
# Site identity
# ---------------------------------------------------------------------------
title: J'Log
SEOTitle: J'Log | Zhejian Peng
author: Zhejian Peng
description: "J'Log — a blog by Zhejian Peng on ranking, recommendation, and Grok Coding RL."
keyword: "J'Log, Zhejian Peng, Grok Coding RL, Recommendation System, Ads Ranking, Machine Learning"
url: "https://jazzikp.github.io"
baseurl: ""
lang: en

github_repo: "https://github.com/jazzikp/jazzikp.github.io"
github_reponame: "jazzikp.github.io"


# ---------------------------------------------------------------------------
# Social accounts — read by _includes/socials.html and the SEO tags
# ---------------------------------------------------------------------------
github_username: jazzikp
linkedin_username: zhejian-peng
twitter_username: zjpeng94
instagram_username: jazzik_peng


# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
permalink: pretty
paginate: 10
plugins: [jekyll-paginate, jekyll-sitemap]

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

# One stylesheet, minified. Partials live in _sass/, wired up by css/site.scss.
sass:
  sass_dir: _sass
  style: compressed

# Appended to css/ and js/ URLs, and names the service worker's caches.
# Bump it whenever a stylesheet or script changes so returning visitors get the
# new file instead of a cached one.
asset_version: 28

exclude:
  - node_modules
  - package.json
  - package-lock.json
  - README.md
  - vendor
  - Gemfile
  - Gemfile.lock
  - workers
  - scripts
  - tests
  - img/src          # full-resolution originals; scripts/optimize-images.sh derives what ships


# ---------------------------------------------------------------------------
# Content
# ---------------------------------------------------------------------------
collections:
  reports:
    output: true
    permalink: /reports/:name/

defaults:
  - scope:
      path: ""
      type: reports
    values:
      layout: report
      author: Zhejian Peng

comments:
  enable: true

# Consultation block on /contact/. GitHub Pages cannot take payments itself:
# set tally_embed for an embedded form, or checkout_url for Stripe / Lemon
# Squeezy. With both blank the page falls back to a LinkedIn link.
consult:
  enabled: true
  price: ""
  turnaround: "24 hours"
  topics: "AI, career, education, ranking, recsys, ads ML, coding RL"
  checkout_url: ""
  tally_embed: ""


# ---------------------------------------------------------------------------
# Progressive web app
# ---------------------------------------------------------------------------
# sw.js is network-first for HTML, so a deploy is always visible on the next
# load. To retire it for people who already have it installed, set KILL_SWITCH
# in sw.js to true and deploy once before turning this off.
service-worker: true


# ---------------------------------------------------------------------------
# Grok chat — the proxy keeps the API key off this public site.
# Deploy workers/grok-proxy.js, then point this at the worker URL.
# ---------------------------------------------------------------------------
grok:
  proxy_url: "https://zhejian-grok-proxy.jazzikp.workers.dev"
